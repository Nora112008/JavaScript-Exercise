<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/all.min.css">
    <link rel="stylesheet" href="./css/bootstrap.css">
    <link rel="stylesheet" href="./css/index.css">
</head>
<body>


    <section id="Gallery" class="py-5">
        <div class="container">
            <div class="row row-gap-4">
                <div class="col-sm-6 col-lg-4">
                    <div class="item">
                        <img src="./images/1.jpg" alt="" class="img-fluid">
                        <div class="layout">
                            <i class="fa-regular fa-square-plus popupKey"></i>
                        </div>
                    </div>
                </div>
                <div class="col-sm-6 col-lg-4">
                    <div class="item">
                        <img src="./images/2.jpg" alt="" class="img-fluid">
                        <div class="layout">
                            <i class="fa-regular fa-square-plus popupKey"></i>
                        </div>
                    </div>
                </div>
                <div class="col-sm-6 col-lg-4">
                    <div class="item">
                        <img src="./images/3.jpg" alt="" class="img-fluid">
                        <div class="layout">
                            <i class="fa-regular fa-square-plus popupKey"></i>
                        </div>
                    </div>
                </div>
                <div class="col-sm-6 col-lg-4">
                    <div class="item">
                        <img src="./images/4.jpg" alt="" class="img-fluid">
                        <div class="layout">
                            <i class="fa-regular fa-square-plus popupKey"></i>
                        </div>
                    </div>
                </div>
                <div class="col-sm-6 col-lg-4">
                    <div class="item">
                        <img src="./images/5.jpg" alt="" class="img-fluid">
                        <div class="layout">
                            <i class="fa-regular fa-square-plus popupKey"></i>
                        </div>
                    </div>
                </div>
                <div class="col-sm-6 col-lg-4">
                    <div class="item">
                        <img src="./images/6.jpg" alt="" class="img-fluid">
                        <div class="layout">
                            <i class="fa-regular fa-square-plus popupKey"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <div class="popup">
        <div class="box">
            <img src="./images/1.jpg" alt="" class="img-fluid">
            <i class="fa-solid fa-xmark close"></i>
            <i class="fa-solid fa-angle-right next"></i>
            <i class="fa-solid fa-angle-left prev"></i>
            <ul class="indecators list-unstyled d-flex">
                <li class="active">1</li>
                <li>2</li>
                <li>3</li>
                <li>4</li>
                <li>5</li>
                <li>6</li>
            </ul>
        </div>
    </div>
    
    <script src="./js/bootstrap.js"></script>
    <script src="./js/index.js"></script>
</body>
</html>
